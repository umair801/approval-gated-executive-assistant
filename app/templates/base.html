<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Executive Assistant{% endblock %}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 17l5 5 9-12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f4ef;--panel:#ffffff;--ink:#1c2024;--muted:#5d6670;--line:#e2e0d8;--accent:#0f766e;--accent-ink:#ffffff;
--warn:#b45309;--warn-bg:#fdf3e3;--bad:#b42318;--bad-bg:#fdecea;--good:#15803d;--good-bg:#e8f5ec;--info-bg:#e6f2f1;--shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1215;--panel:#161b1f;--ink:#e8eaec;--muted:#93a0aa;--line:#262d33;--accent:#2dd4bf;--accent-ink:#06201d;
--warn:#f5b041;--warn-bg:#2a2112;--bad:#ff8a80;--bad-bg:#2c1614;--good:#6ee7a0;--good-bg:#12261a;--info-bg:#112625;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.94rem}
nav a:hover{background:var(--info-bg);color:var(--ink)}
nav a.on{background:var(--info-bg);color:var(--ink);font-weight:600}
.count{background:var(--warn);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;margin-left:5px;font-weight:700}
.chips{display:flex;gap:6px;font-size:.76rem}
.chip{border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:2px 9px;white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:.2em 0 .6em}
h2{font-size:1.1rem;margin:1.6em 0 .6em;letter-spacing:-.01em}
.sub{color:var(--muted);margin:-.4em 0 1.2em}
.banner{background:var(--info-bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.86rem}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid transparent}
.b-pending{background:var(--warn-bg);color:var(--warn)}.b-executed,.b-ok{background:var(--good-bg);color:var(--good)}
.b-rejected,.b-expired,.b-superseded{background:var(--line);color:var(--muted)}.b-failed,.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--accent)}
button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
input[type=text],input[type=password],input[type=number],textarea,select{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:.86rem;color:var(--muted);margin:10px 0 4px}
textarea{resize:vertical;min-height:84px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;min-height:80px}
.msg{max-width:84%;padding:10px 14px;border-radius:14px;word-wrap:break-word}
.txt{white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.composer input{flex:1}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.quick button{font-size:.88rem;padding:6px 12px;border-radius:99px}
.spin{display:none;color:var(--muted);font-size:.88rem}.htmx-request .spin,.htmx-request.spin{display:inline}
.conf{border-left:4px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:8px;margin:6px 0}
.sec{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:8px;margin:6px 0}
.ev{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}.ev:last-child{border:0}
.ev time{min-width:104px;color:var(--muted);font-variant-numeric:tabular-nums}.ev.bad strong{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.opt.sel{outline:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:.92rem}.kv dt{color:var(--muted)}.kv dd{margin:0}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
@media (max-width:640px){.chips{display:none}.msg{max-width:94%}.kv{grid-template-columns:1fr}}
</style>
<script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="/"><i></i>Executive Assistant</a>
  <nav aria-label="Main">
    <a href="/" class="{{ 'on' if active=='home' }}">Chat</a>
    <a href="/plan" class="{{ 'on' if active=='plan' }}">Today</a>
    <a href="/approvals" class="{{ 'on' if active in ('approvals','dinner') }}">Approvals{% if pending_count %}<span class="count">{{ pending_count }}</span>{% endif %}</a>
    <a href="/audit" class="{{ 'on' if active=='audit' }}">Audit log</a>
    <a href="/memory" class="{{ 'on' if active=='memory' }}">Memory</a>
    <a href="/privacy" class="{{ 'on' if active=='privacy' }}">Privacy</a>
  </nav>
  <div class="chips"><span class="chip">{{ 'Sample data' if data_mode=='sample' else 'Google, read-only' }}</span><span class="chip">{{ 'Mock model' if llm_mode=='mock' else 'Claude' }}</span></div>
</div></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
